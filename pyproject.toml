[build-system]
requires = ["setuptools>=75,<76"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-trading-system"
version = "0.1.0"
description = "Local-first trading system with extensible market data ingestion"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.15,<2",
    "fastapi>=0.115,<1",
    "pandas>=2.2,<3",
    "pyarrow>=19,<25",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.8,<3",
    "sqlalchemy>=2.0.38,<2.1",
    "structlog>=25,<26",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<9",
    "ruff>=0.11,<1",
    "starlette>=0.46,<1",
]
ctrader-export = [
    "playwright>=1.50,<2",
]

[project.scripts]
ctrader-copy-exporter = "tools.ctrader_copy_exporter.cli:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["trading*", "tools.ctrader_copy_exporter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
